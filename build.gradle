plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
    // later
    // id 'net.neoforged.moddev' version '2.0.105'
    id "me.modmuss50.mod-publish-plugin" version "2.2.0"
    id 'dev.mixinmcp.decompile' version '1.5.0'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id


repositories {
    mavenLocal()

    maven {
        url = uri("https://maven.shadowsoffire.dev/releases")
        content {
            includeGroup("dev.shadowsoffire")
            includeGroup("snownee.jade")
        }
    }
    maven {
        url = uri("https://cursemaven.com")
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }

    maven {
        url "https://maven.theillusivec4.top/"
    }
    maven {
        url "https://maven.blamejared.com"
        content {
            includeGroup "vazkii.patchouli"
            includeGroupByRegex "net\\.darkhax.*"
            includeGroupByRegex "com\\.blamejared.*"
            includeGroup "org.openzen.zencode"
            includeGroup "mezz.jei"
        }
    }

    maven {
        name = "Curios"
        url = uri("https://maven.theillusivec4.top/")
    }
    maven { url 'https://maven.shedaniel.me/' }
    maven { url 'https://maven.kosmx.dev/' }

    maven { url "https://maven.wispforest.io/releases"}
    maven { url "https://maven.su5ed.dev/releases"}
    maven {
        name = "Iron's Maven - Release"
        url = "https://code.redspace.io/releases"
    }
    maven {
        name = "Iron's Maven - Snapshots"
        url = "https://code.redspace.io/snapshots"
    }
    repositories {
        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroup("software.bernie.geckolib")
            }
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

java {
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            programArguments.addAll('--quickPlayMultiplayer', 'localhost:25565')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        clientExtra {
            client()
            gameDirectory = project.file('run/client2')
            programArguments.addAll('--username', 'Dev2', '--quickPlayMultiplayer', 'localhost:25565')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Dev env
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    localRuntime("snownee.jade:Jade-NeoForge:${minecraft_version}-${jade_version}")
    localRuntime("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config}")

    // Apotheosis
    implementation("dev.shadowsoffire:Placebo:${minecraft_version}-${placebo}")
    implementation("dev.shadowsoffire:Apotheosis:${minecraft_version}-${apotheosis}")
    implementation("dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${apothic_attributes}")
    localRuntime("dev.shadowsoffire:ApothicSpawners:${minecraft_version}-${apothic_spawners}")
    localRuntime("dev.shadowsoffire:ApothicEnchanting:${minecraft_version}-${apothic_enchanting}")
    // Override newer version of patchouli due to dev env crash
    localRuntime("vazkii.patchouli:Patchouli:${patchouli_version}")

    // Iron's Spells 'n Spellbooks
    implementation("io.redspace:irons_spellbooks:${irons_spellbooks}")
    localRuntime("io.redspace:irons_lib:${irons_lib}")
    localRuntime("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}:api")
    localRuntime("top.theillusivec4.curios:curios-neoforge:${curios_version}")
    localRuntime("dev.kosmx.player-anim:player-animation-lib-forge:${player_animator}")

