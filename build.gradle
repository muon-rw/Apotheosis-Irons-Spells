    localRuntime("curse.maven:azurelib-817423:8367232")

    // https://www.curseforge.com/minecraft/mc-mods/discerning-the-eldritch
    compileOnly("curse.maven:discerning-the-eldritch-1143065:8816497")
    localRuntime("curse.maven:discerning-the-eldritch-1143065:8816497")
    localRuntime("curse.maven:prometheus-1365195:7364871")
    localRuntime("curse.maven:soul-fire-d-662413:7364962")
    localRuntime("curse.maven:cobweb-968456:7186943")

    // https://www.curseforge.com/minecraft/mc-mods/monsters-spellbooks-iss
    compileOnly("curse.maven:monsters-spellbooks-iss-1428928:8788560")
    localRuntime("curse.maven:monsters-spellbooks-iss-1428928:8788560")

    // https://www.curseforge.com/minecraft/mc-mods/hazentouvelib
    // https://www.curseforge.com/minecraft/mc-mods/stars-align
