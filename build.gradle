    // Compatibility testing only
    // https://www.curseforge.com/minecraft/mc-mods/irons-spells-n-spellbooks-restrictions
    // localRuntime("curse.maven:irons-spells-n-spellbooks-restrictions-1330168:8448221")

    // https://www.curseforge.com/minecraft/mc-mods/elemental-synergies
    // localRuntime("curse.maven:elemental-synergies-1364850:8901149")
