    compileOnly("curse.maven:hazentouvelib-1528722:8666581")
    localRuntime("curse.maven:hazentouvelib-1528722:8666581")
    localRuntime("curse.maven:stars-align-1526398:8041593")
    localRuntime("curse.maven:eternal-starlight-1080592:8668881")
    localRuntime("com.illusivesoulworks.caelus:caelus-neoforge:${caelus_version}") // required by hazentouvelib

    // https://www.curseforge.com/minecraft/mc-mods/enders-spells-and-stuff-requiem
