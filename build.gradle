    // https://www.curseforge.com/minecraft/mc-mods/azurelib
    compileOnly("curse.maven:cataclysm-spellbooks-1099461:8847070")
    localRuntime("curse.maven:cataclysm-spellbooks-1099461:8847070")
    compileOnly("curse.maven:aces-spell-utils-1299492:8789930")
    localRuntime("curse.maven:aces-spell-utils-1299492:8789930")
    localRuntime("curse.maven:lendercataclysm-551586:8706841")
