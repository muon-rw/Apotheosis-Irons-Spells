// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishMods {
    file = jar.archiveFile
    modLoaders.add("neoforge")
    changelog = new File("$project.rootDir/CHANGELOG.md").getText('UTF-8')
    version = "${mod_version}+${minecraft_version}"
    type = STABLE
    displayName = "${mod_version}+${minecraft_version}"

    curseforge {
        projectId = "${curseforge_project}"
        accessToken = System.getenv("CF_TOKEN")

        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_21)

        client = true
        server = true

        // Dependencies
        requires "apotheosis"
        requires "irons-spells-n-spellbooks"

        optional "cataclysm-spellbooks" // Abyssal
        optional "hazen-n-stuff" // Radiance, Shadow
        optional "tunes-n-tomes-a-bards-journey" // Melody (sound school)
        optional "snackpirates-aeromancy-additions" // Wind
        optional "magic-from-the-east" // Symmetry, Spirit
        optional "enders-spells-and-stuff-requiem" // Mind, Spellblade pending
    }

    //github {
   //     accessToken = providers.environmentVariable("GITHUB_TOKEN")
   //     repository = "muon-rw/Apotheosis-Irons-Spells"
    //    commitish = "master"
    //    tagName = "v${project.version}"
   // }
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            groupId = 'dev.muon'
            artifactId = 'irons-apothic'
            version = "${mod_version}+${minecraft_version}"
            artifact(tasks.named('jar'))
            artifact(tasks.named('sourcesJar', Jar))
        }
    }
    repositories {
        maven {
            name = 'muonReleases'
            url = System.getenv('MAVEN_URL') ?: 'https://maven.muon.rip/releases/'
            credentials {
                username = System.getenv('MAVEN_USERNAME')
                password = System.getenv('MAVEN_PASSWORD')
            }
        }
    }
}

tasks.named('publishMods') {
    dependsOn 'publishAllPublicationsToMuonReleasesRepository'
}
tasks.withType(me.modmuss50.mpp.PublishModTask).configureEach {
    mustRunAfter 'publishAllPublicationsToMuonReleasesRepository'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
